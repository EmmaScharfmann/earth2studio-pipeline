# The June 2026 French heatwave (Meteo-France: 17-30 June; the hottest days
# on record on 23, 24 and 25 June; broken by storms from 27 June).
#
# Initialisations from a week before the onset to the end of the peak, with
# leads to 10 days, so every target time in the event is forecast from up
# to 10 days ahead. A separate season from summer2026_france: its forecasts
# are 240 h long and live under outputs/season/heatwave2026_france/.
#
#   sbatch --gpus-per-node=2 --time=05:00:00 scripts/slurm/season_forecast.sh configs/heatwave2026_france.yaml
#   uv run scripts/run_season.py configs/heatwave2026_france.yaml --stage score
#   then notebooks/heatwave_report.ipynb
name: heatwave2026_france

period: {start: 2026-06-10, end: 2026-06-27}
init: {hours: [0], every_days: 1}
lead_hours: {every: 6, max: 240}

region: france
variable: t2m
ic_source: arco
truths: [era5, ifs_fc0]

models:
  aifs-ens1.0:      {members: 10}
  aurora1.5-ens-6h: {members: 10}
common_members: 10

thresholds:
  quantiles: [0.9, 0.95, 0.975, 0.99, 0.999, 1.0]
  climatology_years: [1979, 2017]
