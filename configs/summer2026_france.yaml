# Seasonal evaluation of AI ensembles: 2 m temperature over France.
# Rerun another period without editing this file:
#   config.load("configs/summer2026_france.yaml", period={"season": "JJA", "year": 2025})
name: summer2026_france

period: {season: JJA, year: 2026}      # or {start: 2026-06-01, end: 2026-08-31}
init: {hours: [0], every_days: 1}
lead_hours: {every: 6, max: 120}

region: france
variable: t2m
# arco: ERA5 from Google's public ARCO-ERA5 store, final ERA5 then the
# preliminary ERA5T a few days behind real time, so all of summer 2026 is
# covered (the Arraylake repo ends at the last final month).
ic_source: arco

# era5: ERA5/ERA5T from ARCO-ERA5. ifs_fc0: step-0 HRES from ECMWF open data, the paper's
# HRES-fc0. Stations are added as a third truth in milestone 4.
# stations: Météo-France hourly, forecast at the nearest land cell;
# stations_lapse: the same cell, height-corrected (observations.py)
truths: [era5, ifs_fc0, stations, stations_lapse]

models:
  aifs-ens1.0:      {members: 10}
  aurora1.5-ens-6h: {members: 10}
  # Atlas CRPS is much slower to run; it is added for the final runs only.
  # atlas-crps:     {members: 10}
common_members: 10

thresholds:
  quantiles: [0.9, 0.95, 0.975, 0.99, 0.999, 1.0]   # 1.0 = record
  climatology_years: [1979, 2017]
